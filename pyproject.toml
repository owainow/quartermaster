[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quartermaster"
version = "0.2.0"
description = "Project-Scoped Capability Provisioner & Armory Engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Quartermaster Contributors" }
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "claude/hooks"]
addopts = "--cov=quartermaster --cov=session_sweep --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["scripts", "claude/hooks"]
omit = [
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
