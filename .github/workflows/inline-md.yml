# inline.md creator workflow v1: review sponsorship PRs before merging.
# Enable GitHub Actions to create pull requests in repository settings.
name: inline.md sponsorship proposals
on:
  workflow_dispatch:
  schedule:
    - cron: '9-59/10 * * * *'
permissions: {}
concurrency:
  group: inline-md-2b415baa-a199-4268-a59d-430392904054
  cancel-in-progress: false
jobs:
  proposals:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Propose reviewed inline.md changes
        shell: bash
        env:
          INLINE_MD_ENROLLMENT_ID: "2b415baa-a199-4268-a59d-430392904054"
          INLINE_MD_ORIGIN: "https://app.inlinemd.dev"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'INLINE_MD_RUNNER_PY'
          """Self-contained GitHub-hosted runner; embedded verbatim in the supplied workflow.
          
          The platform issues immutable byte plans, never commands. This module deliberately
          uses only Python's standard library and never checks out or imports repository code.
          """
          from __future__ import annotations
          
          import base64
          import binascii
          import hashlib
          import json
          import os
          import queue
          import re
          import threading
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from dataclasses import dataclass
          from uuid import UUID
          
          API_ORIGIN = "https://api.github.com"
          MAX_SOURCE_BYTES = 1024 * 1024
          MAX_RESPONSE_BYTES = 4 * 1024 * 1024
          MAX_REQUESTS = 90
          MAX_SECONDS = 240
          MAX_REQUEST_SECONDS = 15
          MAX_PAGES = 8
          SHA = re.compile(r"[0-9a-f]{40}\Z")
          HASH = re.compile(r"[0-9a-f]{64}\Z")
          NAME = re.compile(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+\Z")
          
          
          class RunnerFailure(Exception):
              """A sanitized, symbolic failure; provider text and credentials never escape."""
          
              def __init__(self, code, *, uncertain=False):
                  self.code, self.uncertain = code, uncertain
                  super().__init__(code)
          
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          
          @dataclass(frozen=True)
          class Response:
              status: int
              value: object
          
          
          class Transport:
              """Bound every request and total pass; never follow authenticated redirects."""
          
              def __init__(self, *, opener=None, clock=time.monotonic):
                  self.opener = opener or urllib.request.build_opener(NoRedirect())
                  self.clock, self.started, self.calls = clock, clock(), 0
          
              def request(self, method, url, *, token, payload=None):
                  parts = urllib.parse.urlsplit(url)
                  if (parts.scheme != "https" or not parts.hostname or parts.username or parts.password
                          or parts.port not in (None, 443) or parts.fragment):
                      raise RunnerFailure("invalid_endpoint")
                  self.calls += 1
                  remaining = MAX_SECONDS - (self.clock() - self.started)
                  if self.calls > MAX_REQUESTS or remaining <= 0:
                      raise RunnerFailure("request_budget")
                  raw = None if payload is None else json.dumps(payload, separators=(",", ":")).encode()
                  if raw is not None and len(raw) > MAX_RESPONSE_BYTES:
                      raise RunnerFailure("request_size")
                  headers = {"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json",
                             "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "inline-md-workflow/1"}
                  if raw is not None:
                      headers["Content-Type"] = "application/json"
                  request = urllib.request.Request(url, data=raw, headers=headers, method=method)
                  # A socket timeout alone is an inactivity limit: a slow response can keep
                  # sending bytes indefinitely. The daemon also gives every whole exchange
                  # an absolute deadline. A timed-out mutation may still finish in GitHub;
                  # stop effects and retain the platform's guard until this job completes.
                  result = queue.Queue(maxsize=1)
          
                  def exchange():
                      try:
                          result.put((True, self._exchange(request, method, min(MAX_REQUEST_SECONDS, remaining))))
                      except Exception as error:
                          result.put((False, error))
          
                  threading.Thread(target=exchange, daemon=True, name="inline-md-request").start()
                  try:
                      succeeded, value = result.get(timeout=min(MAX_REQUEST_SECONDS, remaining))
                  except queue.Empty:
                      raise RunnerFailure("response_lost" if method != "GET" else "provider_unavailable", uncertain=method != "GET") from None
                  if not succeeded:
                      if isinstance(value, RunnerFailure):
                          raise value
                      raise RunnerFailure("provider_unavailable", uncertain=method != "GET") from None
                  return value
          
              def _exchange(self, request, method, timeout):
                  mutation = method != "GET"
                  try:
                      try:
                          response = self.opener.open(request, timeout=timeout)
                      except urllib.error.HTTPError as error:
                          response = error
                      with response:
                          status = response.status
                          body = response.read(MAX_RESPONSE_BYTES + 1)
                      if len(body) > MAX_RESPONSE_BYTES:
                          raise RunnerFailure("response_size", uncertain=mutation)
                      if 300 <= status < 400:
                          raise RunnerFailure("redirect_denied", uncertain=mutation)
                      if status >= 500 or status == 202:
                          raise RunnerFailure("provider_unavailable", uncertain=mutation)
                      try:
                          value = None if not body else json.loads(body)
                      except (ValueError, UnicodeError, RecursionError):
                          raise RunnerFailure("invalid_response", uncertain=mutation) from None
                      return Response(status, value)
                  except RunnerFailure:
                      raise
                  except (OSError, TimeoutError, urllib.error.URLError, ValueError):
                      raise RunnerFailure("response_lost" if mutation else "provider_unavailable", uncertain=mutation) from None
          
          
          def positive(value):
              return type(value) is int and 0 < value < 2**63
          
          
          def object_value(value):
              if not isinstance(value, dict):
                  raise RunnerFailure("invalid_response")
              return value
          
          
          def origin_value(value):
              if not isinstance(value, str):
                  raise RunnerFailure("invalid_origin")
              parts = urllib.parse.urlsplit(value)
              if (parts.scheme != "https" or not parts.hostname or parts.username or parts.password
                      or parts.port not in (None, 443) or parts.path not in ("", "/")
                      or parts.query or parts.fragment or parts.netloc != parts.hostname):
                  raise RunnerFailure("invalid_origin")
              return "https://" + parts.hostname
          
          
          def branch_value(value):
              if (not isinstance(value, str) or not 1 <= len(value) <= 180
                      or not re.fullmatch(r"[A-Za-z0-9_./-]+", value) or ".." in value
                      or "//" in value or value.startswith(("/", ".", "-"))
                      or value.endswith(("/", "."))
                      or any(part.startswith(".") or part.endswith(".lock") for part in value.split("/"))):
                  raise RunnerFailure("invalid_grant")
              return value
          
          
          def decode_bytes(encoded, digest):
              if not isinstance(encoded, str) or not isinstance(digest, str) or not HASH.fullmatch(digest):
                  raise RunnerFailure("invalid_grant")
              if len(encoded) > (MAX_SOURCE_BYTES + 2) // 3 * 4:
                  raise RunnerFailure("source_size")
              try:
                  raw = base64.b64decode(encoded, validate=True)
              except (ValueError, binascii.Error):
                  raise RunnerFailure("invalid_grant") from None
              if len(raw) > MAX_SOURCE_BYTES or hashlib.sha256(raw).hexdigest() != digest:
                  raise RunnerFailure("invalid_grant")
              return raw
          
          
          def git_blob_sha(raw):
              return hashlib.sha1(b"blob " + str(len(raw)).encode() + b"\0" + raw).hexdigest()
          
          
          COMMON_FIELDS = {"version", "claim_id", "operation_id", "booking_id", "kind", "action",
                           "repository_id", "repository_owner_id", "repository_full_name", "path",
                           "base_branch", "head_branch", "base_commit_sha", "base_blob_sha",
                           "original_base64", "original_sha256", "desired_base64", "desired_sha256",
                           "commit_message", "pr_title", "pr_body"}
          
          
          def validate_grant(value):
              grant = object_value(value)
              extra = {"pr_number", "head_sha"} if grant.get("kind") in {"close", "retire"} else set()
              if set(grant) != COMMON_FIELDS | extra or type(grant.get("version")) is not int or grant["version"] != 1:
                  raise RunnerFailure("invalid_grant")
              for field in ("claim_id", "operation_id", "booking_id"):
                  try:
                      if str(UUID(grant[field])) != grant[field]:
                          raise ValueError
                  except (ValueError, TypeError, AttributeError):
                      raise RunnerFailure("invalid_grant") from None
              if (grant["kind"] not in {"publish", "close", "retire"} or grant["action"] not in {"insert", "remove"}
                      or not positive(grant["repository_id"]) or not positive(grant["repository_owner_id"])
                      or not isinstance(grant["repository_full_name"], str) or not NAME.fullmatch(grant["repository_full_name"])
                      or any(part in {".", ".."} for part in grant["repository_full_name"].split("/"))
                      or (grant["kind"] == "close" and grant["action"] != "insert")):
                  raise RunnerFailure("invalid_grant")
              path = grant["path"]
              if (not isinstance(path, str) or len(path) > 512 or not path.split("/")[-1] == "SKILL.md"
                      or any(part in {"", ".", ".."} for part in path.split("/"))
                      or any(char in path for char in "\\?#") or any(ord(char) < 32 for char in path)):
                  raise RunnerFailure("invalid_grant")
              base, head = branch_value(grant["base_branch"]), branch_value(grant["head_branch"])
              if head == base or not head.startswith("inline-md/") or grant["operation_id"] not in head:
                  raise RunnerFailure("invalid_grant")
              for field in ("base_commit_sha", "base_blob_sha"):
                  if not isinstance(grant[field], str) or not SHA.fullmatch(grant[field]):
                      raise RunnerFailure("invalid_grant")
              for field, limit in (("commit_message", 500), ("pr_title", 250), ("pr_body", 10000)):
                  if not isinstance(grant[field], str) or not 1 <= len(grant[field]) <= limit or "\x00" in grant[field]:
                      raise RunnerFailure("invalid_grant")
              original = decode_bytes(grant["original_base64"], grant["original_sha256"])
              desired = decode_bytes(grant["desired_base64"], grant["desired_sha256"])
              if git_blob_sha(original) != grant["base_blob_sha"] or desired == original:
                  raise RunnerFailure("invalid_grant")
              if extra:
                  number = grant["pr_number"]
                  if not isinstance(grant["head_sha"], str) or not SHA.fullmatch(grant["head_sha"]):
                      raise RunnerFailure("invalid_grant")
                  if not positive(number) and not (grant["kind"] == "retire" and number is None):
                      raise RunnerFailure("invalid_grant")
              return grant, original, desired
          
          
          class Runner:
              def __init__(self, transport, token):
                  if not isinstance(token, str) or not token or any(char.isspace() for char in token):
                      raise RunnerFailure("missing_github_token")
                  self.transport, self.token = transport, token
                  self.grant = None
                  self.effects_seen = False
          
              def api(self, method, suffix, *, query=None, payload=None, allow404=False):
                  url = API_ORIGIN + "/repos/" + self.grant["repository_full_name"] + suffix
                  if query:
                      url += "?" + urllib.parse.urlencode(query)
                  response = self.transport.request(method, url, token=self.token, payload=payload)
                  expected = {200, 201, 204} if method != "GET" else {200}
                  if allow404:
                      expected.add(404)
                  if response.status not in expected:
                      raise RunnerFailure("provider_denied", uncertain=method != "GET" and response.status >= 500)
                  if method != "GET":
                      self.effects_seen = True
                  return response
          
              def collection(self, suffix, *, query=None):
                  values = []
                  for page in range(1, MAX_PAGES + 1):
                      response = self.api("GET", suffix, query={**(query or {}), "per_page": 100, "page": page})
                      if not isinstance(response.value, list) or len(response.value) > 100:
                          raise RunnerFailure("invalid_response")
                      values.extend(response.value)
                      if len(response.value) < 100:
                          return values
                  raise RunnerFailure("inventory_limit")
          
              def reference(self, branch, *, allow_missing=False):
                  response = self.api("GET", "/git/ref/heads/" + urllib.parse.quote(branch, safe="/"), allow404=allow_missing)
                  if response.status == 404:
                      return None
                  value = object_value(response.value)
                  obj = object_value(value.get("object"))
                  if value.get("ref") != "refs/heads/" + branch or obj.get("type") != "commit" or not SHA.fullmatch(str(obj.get("sha", ""))):
                      raise RunnerFailure("reference_mismatch")
                  return obj["sha"]
          
              def verify_repository(self):
                  value = object_value(self.api("GET", "").value)
                  owner = object_value(value.get("owner"))
                  if (not positive(value.get("id")) or not positive(owner.get("id"))
                          or value.get("id") != self.grant["repository_id"] or owner.get("id") != self.grant["repository_owner_id"]
                          or value.get("full_name") != self.grant["repository_full_name"] or value.get("private") is not False
                          or value.get("archived") is not False or value.get("disabled") is not False
                          or value.get("default_branch") != self.grant["base_branch"]):
                      raise RunnerFailure("repository_mismatch")
          
              def verify_content(self, commit, expected, blob):
                  suffix = "/contents/" + urllib.parse.quote(self.grant["path"], safe="/")
                  value = object_value(self.api("GET", suffix, query={"ref": commit}).value)
                  try:
                      actual = base64.b64decode(value.get("content", "").replace("\n", ""), validate=True)
                  except (ValueError, AttributeError, binascii.Error):
                      raise RunnerFailure("content_mismatch") from None
                  if (value.get("type") != "file" or value.get("path") != self.grant["path"]
                          or value.get("encoding") != "base64" or value.get("sha") != blob
                          or type(value.get("size")) is not int or value.get("size") != len(expected) or actual != expected):
                      raise RunnerFailure("content_mismatch")
          
              def verify_head(self, head_sha, desired):
                  if not isinstance(head_sha, str) or not SHA.fullmatch(head_sha):
                      raise RunnerFailure("head_mismatch")
                  commit = object_value(self.api("GET", "/git/commits/" + head_sha).value)
                  parents = commit.get("parents")
                  if (commit.get("sha") != head_sha or commit.get("message") != self.grant["commit_message"]
                          or not isinstance(parents, list) or len(parents) != 1
                          or object_value(parents[0]).get("sha") != self.grant["base_commit_sha"]):
                      raise RunnerFailure("head_mismatch")
                  comparison = object_value(self.api("GET", "/compare/" + self.grant["base_commit_sha"] + "..." + head_sha,
                                                           query={"per_page": 100, "page": 1}).value)
                  files = comparison.get("files")
                  commits = comparison.get("commits")
                  if (comparison.get("status") != "ahead" or comparison.get("ahead_by") != 1
                          or comparison.get("behind_by") != 0 or comparison.get("total_commits") != 1
                          or any(type(comparison.get(key)) is not int for key in ("ahead_by", "behind_by", "total_commits"))
                          or not isinstance(commits, list) or len(commits) != 1
                          or object_value(commits[0]).get("sha") != head_sha or not isinstance(files, list) or len(files) != 1):
                      raise RunnerFailure("diff_mismatch")
                  file = object_value(files[0])
                  if file.get("filename") != self.grant["path"] or file.get("status") != "modified" or file.get("previous_filename"):
                      raise RunnerFailure("diff_mismatch")
                  self.verify_content(head_sha, desired, git_blob_sha(desired))
          
              def verify_pr(self, number, head_sha, *, state=None):
                  value = object_value(self.api("GET", "/pulls/" + str(number)).value)
                  if not positive(value.get("id")) or not positive(value.get("number")) or value.get("number") != number:
                      raise RunnerFailure("pr_mismatch")
                  for role, branch, sha in (("head", self.grant["head_branch"], head_sha),
                                             ("base", self.grant["base_branch"], None)):
                      side = object_value(value.get(role))
                      repo = object_value(side.get("repo"))
                      owner = object_value(repo.get("owner"))
                      if (not positive(repo.get("id")) or not positive(owner.get("id"))
                              or repo.get("id") != self.grant["repository_id"] or owner.get("id") != self.grant["repository_owner_id"]
                              or repo.get("full_name") != self.grant["repository_full_name"] or side.get("ref") != branch
                              or (sha is not None and side.get("sha") != sha)
                              or (role == "base" and self.grant["kind"] == "publish"
                                  and side.get("sha") != self.grant["base_commit_sha"])):
                          raise RunnerFailure("pr_mismatch")
                  if (value.get("title") != self.grant["pr_title"] or value.get("body") != self.grant["pr_body"]
                          or (state is not None and value.get("state") != state)):
                      raise RunnerFailure("pr_mismatch")
                  files = self.collection("/pulls/" + str(number) + "/files")
                  if len(files) != 1 or object_value(files[0]).get("filename") != self.grant["path"] or files[0].get("status") != "modified":
                      raise RunnerFailure("diff_mismatch")
                  return value
          
              def proposals(self):
                  owner = self.grant["repository_full_name"].split("/")[0]
                  return self.collection("/pulls", query={"state": "all", "head": owner + ":" + self.grant["head_branch"]})
          
              def publish(self, original, desired):
                  base = self.grant["base_commit_sha"]
                  if self.reference(self.grant["base_branch"]) != base:
                      raise RunnerFailure("base_changed")
                  self.verify_content(base, original, self.grant["base_blob_sha"])
                  head = self.reference(self.grant["head_branch"], allow_missing=True)
                  if head is None:
                      # One non-forced ref creation. A lost response never reaches PUT.
                      value = object_value(self.api("POST", "/git/refs", payload={"ref": "refs/heads/" + self.grant["head_branch"], "sha": base}).value)
                      if value.get("ref") != "refs/heads/" + self.grant["head_branch"] or object_value(value.get("object")).get("sha") != base:
                          raise RunnerFailure("mutation_response_mismatch", uncertain=True)
                      head = self.reference(self.grant["head_branch"])
                  if head == base:
                      # An existing proposal on an unmodified head is ambiguous; don't move it.
                      if self.proposals():
                          raise RunnerFailure("proposal_conflict")
                      value = object_value(self.api("PUT", "/contents/" + urllib.parse.quote(self.grant["path"], safe="/"), payload={
                          "message": self.grant["commit_message"], "content": self.grant["desired_base64"],
                          "sha": self.grant["base_blob_sha"], "branch": self.grant["head_branch"],
                      }).value)
                      head = object_value(value.get("commit")).get("sha")
                      if not isinstance(head, str) or not SHA.fullmatch(head):
                          raise RunnerFailure("mutation_response_mismatch", uncertain=True)
                  self.verify_head(head, desired)
                  if self.reference(self.grant["head_branch"]) != head:
                      raise RunnerFailure("head_changed")
                  proposals = self.proposals()
                  if len(proposals) > 1:
                      raise RunnerFailure("proposal_conflict")
                  if proposals:
                      number = object_value(proposals[0]).get("number")
                      if not positive(number):
                          raise RunnerFailure("pr_mismatch")
                      self.verify_pr(number, head, state="open")
                  else:
                      value = object_value(self.api("POST", "/pulls", payload={"title": self.grant["pr_title"], "body": self.grant["pr_body"],
                                                                             "head": self.grant["head_branch"], "base": self.grant["base_branch"]}).value)
                      number = value.get("number")
                      if not positive(number):
                          raise RunnerFailure("mutation_response_mismatch", uncertain=True)
                      self.verify_pr(number, head, state="open")
                  return {"outcome": "proposed", "head_sha": head, "pr_number": number}
          
              def cleanup(self, original, desired):
                  number, head = self.grant["pr_number"], self.grant["head_sha"]
                  actual = self.reference(self.grant["head_branch"], allow_missing=True)
                  if actual is None:
                      # 404 is only a runner hint; the platform must prove inventory/terminality.
                      if self.grant["kind"] == "retire":
                          if number is not None:
                              self.verify_pr(number, head, state="closed")
                          elif self.proposals():
                              raise RunnerFailure("proposal_conflict")
                          return {"outcome": "retired", "head_sha": head, **({"pr_number": number} if number is not None else {})}
                      raise RunnerFailure("head_missing")
                  if actual != head:
                      raise RunnerFailure("head_changed")
                  self.verify_content(self.grant["base_commit_sha"], original, self.grant["base_blob_sha"])
                  if head == self.grant["base_commit_sha"]:
                      if number is not None:
                          raise RunnerFailure("head_mismatch")
                      self.verify_content(head, original, self.grant["base_blob_sha"])
                  else:
                      self.verify_head(head, desired)
                  if number is None:
                      if self.proposals():
                          raise RunnerFailure("proposal_conflict")
                  else:
                      value = self.verify_pr(number, head)
                      if self.grant["kind"] == "close":
                          if value.get("merged") is not False or value.get("state") not in {"open", "closed"}:
                              raise RunnerFailure("pr_mismatch")
                          if value["state"] == "open":
                              self.api("PATCH", "/pulls/" + str(number), payload={"state": "closed"})
                              self.verify_pr(number, head, state="closed")
                          return {"outcome": "closed", "head_sha": head, "pr_number": number}
                      if value.get("state") != "closed":
                          raise RunnerFailure("pr_open")
                  # Recheck just before deletion; DELETE has no conditional/force option.
                  # The platform retains safety guards until this run independently completes.
                  if self.reference(self.grant["head_branch"]) != head:
                      raise RunnerFailure("head_changed")
                  self.api("DELETE", "/git/refs/heads/" + urllib.parse.quote(self.grant["head_branch"], safe="/"))
                  return {"outcome": "retired", "head_sha": head, **({"pr_number": number} if number is not None else {})}
          
              def execute(self, grant):
                  try:
                      self.grant, original, desired = validate_grant(grant)
                      self.verify_repository()
                      return self.publish(original, desired) if self.grant["kind"] == "publish" else self.cleanup(original, desired)
                  except RunnerFailure as error:
                      return {"outcome": "uncertain" if error.uncertain or self.effects_seen else "failed", "error_code": error.code}
          
          
          def oidc_token(transport, environment, origin):
              url, credential = environment.get("ACTIONS_ID_TOKEN_REQUEST_URL", ""), environment.get("ACTIONS_ID_TOKEN_REQUEST_TOKEN", "")
              parts = urllib.parse.urlsplit(url)
              if (parts.scheme != "https" or not parts.hostname or not parts.hostname.endswith(".actions.githubusercontent.com")
                      or parts.username or parts.password or parts.port not in (None, 443) or parts.fragment
                      or not credential or any(char.isspace() for char in credential)):
                  raise RunnerFailure("missing_oidc_environment")
              query = urllib.parse.parse_qsl(parts.query, keep_blank_values=True)
              query = [(key, value) for key, value in query if key != "audience"]
              query.append(("audience", origin + "/github-actions"))
              url = urllib.parse.urlunsplit(parts._replace(query=urllib.parse.urlencode(query)))
              response = transport.request("GET", url, token=credential)
              value = object_value(response.value).get("value")
              if response.status != 200 or not isinstance(value, str) or not 10 <= len(value) <= 20000 or any(char.isspace() for char in value):
                  raise RunnerFailure("oidc_unavailable")
              return value
          
          
          def platform_post(transport, environment, origin, endpoint, payload):
              token = oidc_token(transport, environment, origin)
              response = transport.request("POST", origin + "/integrations/github/workflow/" + endpoint + "/", token=token, payload=payload)
              if response.status != 200:
                  raise RunnerFailure("platform_denied")
              return object_value(response.value)
          
          
          def run(environment=None, *, transport=None):
              environment, transport = dict(os.environ if environment is None else environment), transport or Transport()
              try:
                  origin = origin_value(environment.get("INLINE_MD_ORIGIN"))
                  enrollment = str(UUID(environment.get("INLINE_MD_ENROLLMENT_ID", "")))
                  claim = platform_post(transport, environment, origin, "claim", {"enrollment_id": enrollment})
                  if set(claim) != {"work"}:
                      raise RunnerFailure("invalid_response")
                  if claim["work"] is None:
                      return {"outcome": "idle"}
                  grant, _, _ = validate_grant(claim["work"])
                  report = Runner(transport, environment.get("GITHUB_TOKEN", "")).execute(grant)
                  # Fresh OIDC for a report; GITHUB_TOKEN is never part of this request.
                  platform_post(transport, environment, origin, "report", {"enrollment_id": enrollment, "claim_id": grant["claim_id"], "report": report})
                  return report
              except RunnerFailure as error:
                  return {"outcome": "uncertain" if error.uncertain else "failed", "error_code": error.code}
              except (ValueError, TypeError, AttributeError):
                  return {"outcome": "failed", "error_code": "invalid_environment"}
          
          
          if __name__ == "__main__":
              result = run()
              print(json.dumps(result, sort_keys=True))
              raise SystemExit(0 if result["outcome"] in {"idle", "proposed", "closed", "retired"} else 1)
